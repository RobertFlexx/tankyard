[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.14"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
postcard = { version = "1", features = ["alloc", "use-std"] }
macroquad = { version = "0.4.16", default-features = false }
renet = "2.0.0"
renet_netcode = "2.0.0"
clap = { version = "4", features = ["derive"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tankyard-content = { path = "crates/tankyard-content" }
tankyard-mods = { path = "crates/tankyard-mods" }
tankyard-core = { path = "crates/tankyard-core" }
tankyard-ai = { path = "crates/tankyard-ai" }
tankyard-protocol = { path = "crates/tankyard-protocol" }
tankyard-server = { path = "crates/tankyard-server" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
