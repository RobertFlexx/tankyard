[package]
name = "tankyard-mods"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ring = "0.17"
tankyard-content.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "webp", "ico"] }
# Asset formats beyond plain images: vector art, icon and paint editor files,
# and 3D models rendered into sprites.
resvg = { version = "0.49", default-features = false }
icns = "0.5"
asefile = "0.3.8"
psd = "0.3.5"
gltf = { version = "1.4", default-features = false, features = ["utils"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
