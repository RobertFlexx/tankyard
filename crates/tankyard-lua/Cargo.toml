[package]
name = "tankyard-lua"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# LuaJIT is built from vendored sources and linked statically on every platform.
mlua = { version = "0.12", default-features = false, features = ["luajit", "vendored", "send", "serde"] }
tankyard-content.workspace = true
tankyard-core.workspace = true
tankyard-mods.workspace = true

[dev-dependencies]
serde_json.workspace = true
