[package]
name = "tankyard-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Luau (with its native code generator) is built from vendor/luau0-src and
# linked statically on every platform.
mlua = { version = "0.12", default-features = false, features = ["luau-jit", "send", "serde"] }
tankyard-content.workspace = true
tankyard-core.workspace = true
tankyard-mods.workspace = true

[dev-dependencies]
serde_json.workspace = true
