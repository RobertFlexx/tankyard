[package]
name = "tankyard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "tankyard-server"

[dependencies]
ring = "0.17"
bastion-anticheat.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
renet.workspace = true
renet_netcode.workspace = true
tankyard-content.workspace = true
tankyard-mods.workspace = true
tankyard-core.workspace = true
tankyard-ai.workspace = true
tankyard-protocol.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
socket2 = "0.6"

[[bin]]
name = "tankyard-server"
path = "src/main.rs"

[[bin]]
name = "tankyard-load"
path = "src/bin/load.rs"


[[bin]]
name = "tankyard-relay"
path = "src/bin/relay.rs"
