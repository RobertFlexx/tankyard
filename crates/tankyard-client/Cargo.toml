[package]
name = "tankyard-client"
default-run = "tankyard"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tankyard"
path = "src/main.rs"

[[bin]]
name = "tankyard-models"
path = "src/models.rs"
test = false

[dependencies]
macroquad.workspace = true
tankyard-core.workspace = true
tankyard-content.workspace = true
tankyard-mods.workspace = true
tankyard-server.workspace = true
tankyard-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
cpal = "0.16"
opus = "0.4"
display-info = "0.5.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Load the desktop's XCB ABI at runtime, matching Miniquad's display handling.
xcb = { version = "1.7", features = ["dl", "randr"] }
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
